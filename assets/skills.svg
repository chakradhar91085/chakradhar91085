<svg xmlns="http://www.w3.org/2000/svg" width="800" height="266" viewBox="0 0 800 266">
  <style>
    
    @keyframes ceTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes ceReveal { 0%, 5% { opacity: 0; transform: translateY(6px); } 18%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes ceWipe { 0%, 8% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(1); } }

    
    .ce-eyebrow { animation: ceReveal 9s ease-out infinite; }
    .ce-count { animation: ceReveal 9s ease-out infinite; animation-delay: 0.90s; }
    .ce-rule { animation: ceWipe 9s ease-out infinite; transform-box: fill-box; transform-origin: left center; animation-delay: 0.54s; }
    .ce-row { animation: ceReveal 9s ease-out infinite; }
    .ce-row-0 { animation-delay: 1.08s; }
    .ce-row-1 { animation-delay: 1.35s; }
    .ce-row-2 { animation-delay: 1.62s; }
    .ce-row-3 { animation-delay: 1.89s; }
    .ce-row-4 { animation-delay: 2.16s; }
    .ce-row-5 { animation-delay: 2.43s; }
    .ce-row-6 { animation-delay: 2.70s; }
    .ce-row-7 { animation-delay: 2.97s; }
    
  </style>

